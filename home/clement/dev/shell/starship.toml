[os]
disabled = false

[username]
show_always = true
format = "[$user]($style)"

[status]
disabled = false
symbol = "[x](bold red)"

[character]
success_symbol = "[>](purple)"
error_symbol = "[X](red)"
vimcmd_symbol = "[<](green)"

[cmd_duration]
format = "[$duration]($style)"

[git_metrics]
disabled = false
format = "(\\[( [+$added]($added_style)) ([-$deleted]($deleted_style) )\\] )"

[git_status]
disabled = false
format = '([$all_status$ahead_behind]($style) )'
style = 'bold yellow'
stashed = ''
modified = ''
deleted = ''
renamed = ''

[direnv]
disabled = false

[custom.zmx]
command = "echo $ZMX_SESSION"
when = '[ -n "$ZMX_SESSION" ]'
symbol = "󱂬 "
style = "cyan bold"
format = "[$symbol$output ]($style)"

[custom.jj_workspace]
command = '''
root=$PWD
until [ -e "$root/.jj" ]; do
  [ "$root" = / ] && exit
  root=$(dirname "$root")
done
[ -f "$root/.jj/repo" ] || exit
repo=$(cd "$root/.jj" && cd "$(cat repo)/../.." && pwd)
printf '%s' "${repo##*/}"
'''
when = true
shell = ["sh"]
style = "purple"
format = "([󰙅 $output ]($style))"

[custom.jj]
command = '''
jj log --ignore-working-copy --no-graph --reversed --color never \
  -r '@ | (latest(heads(::@ & (bookmarks() | remote_bookmarks()))) ~ @)' \
  -T 'separate(" ",
    bookmarks,
    if(current_working_copy && conflict, "conflict"),
    if(current_working_copy && divergent, "divergent"),
  ) ++ " "' 2> /dev/null
'''
when = true
shell = ["sh"]
style = "purple"
format = "(on [ $output ]($style))"
